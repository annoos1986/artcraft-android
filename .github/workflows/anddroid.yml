name: Universal APK Builder

on:
  workflow_dispatch:
  push:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          # تم إزالة cache: gradle من هنا لحل المشكلة نهائياً

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Detect and Build APK
        run: |
          echo "=== محتويات المستودع ==="
          ls -la
          
          # البحث عن ملف gradlew في أي مجلد داخل المشروع
          GRADLEW_PATH=$(find . -name "gradlew" | head -n 1)
          
          if [ -n "$GRADLEW_PATH" ]; then
            echo "تم العثور على مشروع أندرويد في: $GRADLEW_PATH"
            DIR=$(dirname "$GRADLEW_PATH")
            cd "$DIR"
            chmod +x gradlew
            ./gradlew assembleDebug
          else
            echo "لا يوجد ملف gradlew مباشر.. جاري التحويل إلى أندرويد عبر Capacitor"
            mkdir -p www_build
            if [ -f "package.json" ]; then
              npm install
              npm run build || true
            fi
            if [ -d "dist" ]; then cp -r dist/* www_build/;
            elif [ -d "build" ]; then cp -r build/* www_build/;
            else find . -maxdepth 2 \( -name "*.html" -o -name "*.css" -o -name "*.js" \) -exec cp {} www_build/ \; 2>/dev/null || true;
            fi
            
            if [ ! -f "www_build/index.html" ]; then
              FIRST_HTML=$(find . -name "*.html" | head -n 1)
              if [ -n "$FIRST_HTML" ]; then cp "$FIRST_HTML" www_build/index.html; else echo "<h1>ArtCraft</h1>" > www_build/index.html; fi
            fi
            
            npm init -y
            npm install @capacitor/core @capacitor/cli @capacitor/android
            npx cap init ArtCraft com.artcraft.app --web-dir www_build
            npx cap add android
            npx cap sync android
            cd android
            chmod +x gradlew
            ./gradlew assembleDebug
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ArtCraft-APK
          path: "**/*.apk"
