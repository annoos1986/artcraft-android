name: ArtCraft APK Builder

on:
  workflow_dispatch:
    inputs:
      app_name:
        description: 'اختر التطبيق المراد بناؤه'
        required: true
        default: 'photocraft'
        type: choice
        options:
          - photocraft
          - vectorcraft
          - filmcraft
          - lightcraft
          - pdfcraft
          - effectcraft
          - designcraft
          - figcraft
          - wordcraft
          - soundcraft
          - deckcraft
          - cadcraft
          - gridcraft
  push:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Install Rust & Android NDK Target
        run: |
          # تثبيت هدف الأندرويد 64-بت للغة Rust
          rustup target add aarch64-linux-android
          
          # تثبيت الأدوات المساعدة التي قد يطلبها السكربت
          sudo apt-get update
          sudo apt-get install -y jq zip unzip build-essential pkg-config libssl-dev cmake ninja-build

          # التأكد من تعريف مسارات Android SDK و NDK للسكربت
          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> $GITHUB_ENV
          if [ -d "$ANDROID_SDK_ROOT/ndk" ]; then
            LATEST_NDK=$(ls -1 "$ANDROID_SDK_ROOT/ndk" | sort -V | tail -n 1)
            echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/$LATEST_NDK" >> $GITHUB_ENV
            echo "ANDROID_NDK_ROOT=$ANDROID_SDK_ROOT/ndk/$LATEST_NDK" >> $GITHUB_ENV
            echo "NDK_HOME=$ANDROID_SDK_ROOT/ndk/$LATEST_NDK" >> $GITHUB_ENV
          fi

      - name: Build ArtCraft APK
        run: |
          chmod +x *.sh lib/*.sh 2>/dev/null || true
          APP="${{ github.event.inputs.app_name || 'photocraft' }}"
          echo "=== جاري بناء تطبيق: -$APP ==="
          
          # تشغيل الأمر الرسمي كما طلب السكربت بالضبط
          bash build.sh -"$APP" || {
            echo "=== سجل الأخطاء من مجلد logs ==="
            cat logs/* 2>/dev/null || true
            exit 1
          }

      - name: Upload Final APK
        uses: actions/upload-artifact@v4
        with:
          name: ArtCraft-APK
          path: |
            output/*.apk
            **/*.apk
