name: ArtCraft Official Builder

on:
  workflow_dispatch:
  push:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code with submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run Official ArtCraft Build Script
        run: |
          chmod +x *.sh lib/*.sh 2>/dev/null || true
          
          echo "=== التطبيقات المتاحة داخل adapters ==="
          ls -1 adapters
          
          # قراءة أسماء التطبيقات الموجودة وبناؤها واحداً تلو الآخر
          for app in $(ls -1 adapters); do
            echo "========================================="
            echo "جاري بناء تطبيق: $app"
            echo "========================================="
            ./build-debug.sh "$app" || ./build.sh "$app" || RAW_APP="$app" ./build-debug.sh "$app"
          done

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ArtCraft-APK
          path: "**/*.apk"
