name: ArtCraft Official Builder

on:
  workflow_dispatch:
  push:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code with submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Run Official ArtCraft Build Script
        run: |
          echo "=== محتوى ملف build.sh ==="
          cat build.sh
          echo "=== محتوى ملف build-debug.sh ==="
          cat build-debug.sh
          
          chmod +x *.sh
          
          # تشغيل سكربت البناء الأصلي الخاص بالمشروع
          ./build-debug.sh || ./build.sh

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ArtCraft-APK
          path: "**/*.apk"
